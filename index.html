<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 로또 번호 추첨기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neon-blue': '#00f3ff',
                        'neon-purple': '#bc13fe',
                        'dark-bg': '#0f172a',
                        'panel-bg': '#1e293b',
                    },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-white min-h-screen flex flex-col items-center py-10 font-sans">

    <!-- Header -->
    <header class="text-center mb-10 relative z-10">
        <h1 class="text-4xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-neon-blue to-neon-purple drop-shadow-lg">
            AI LOTTO GEN
        </h1>
        <p class="text-gray-400 mt-2 text-sm md:text-base">빅데이터 기반 당첨 확률 분석 시스템</p>
    </header>

    <!-- Main Card -->
    <main class="w-full max-w-lg px-4 relative z-10">

        <!-- Ball Display Area -->
        <div class="bg-panel-bg rounded-2xl shadow-2xl shadow-neon-blue/20 p-8 mb-6 border border-gray-700 relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-br from-neon-blue/5 to-transparent pointer-events-none"></div>

            <div id="ball-container" class="flex flex-wrap justify-center gap-4 min-h-[80px]">
                <!-- Balls will be injected here via JS -->
                <div class="text-gray-500 italic animate-pulse">번호를 생성해주세요...</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="text-center mb-8">
            <button id="generate-btn" class="relative inline-flex items-center justify-center p-0.5 mb-2 mr-2 overflow-hidden text-sm font-medium rounded-lg group bg-gradient-to-br from-neon-blue to-neon-purple group-hover:from-neon-blue group-hover:to-neon-purple hover:text-white focus:ring-4 focus:outline-none focus:ring-purple-800 transform hover:scale-105 transition-transform duration-200 active:scale-95">
                <span class="relative px-12 py-4 transition-all ease-in duration-75 bg-gray-900 rounded-md group-hover:bg-opacity-0 text-xl font-bold text-white">
                    AI 번호 생성하기
                </span>
            </button>
            <p id="status-text" class="text-xs text-neon-blue h-4 mt-2 opacity-0 transition-opacity">과거 데이터 분석 중...</p>
        </div>

        <!-- ADVERTISEMENT SECTION (Requested Requirement) -->
        <div class="w-full bg-gray-800 border-2 border-dashed border-gray-600 rounded-lg h-32 flex items-center justify-center mb-8 relative overflow-hidden group cursor-pointer hover:border-gray-500 transition-colors">
            <div class="absolute top-1 right-2 text-[10px] text-gray-500 border border-gray-600 px-1 rounded">AD</div>
            <div class="text-center">
                <p class="text-gray-400 font-bold text-lg">스폰서 광고 영역</p>
                <p class="text-gray-600 text-sm">이곳에 광고가 표시됩니다.</p>
                <button class="mt-2 text-xs bg-gray-700 px-2 py-1 rounded text-gray-400 group-hover:bg-gray-600 group-hover:text-white transition-colors">자세히 보기</button>
            </div>
        </div>

        <!-- My Numbers History -->
        <div class="bg-panel-bg/80 rounded-xl p-6 border border-gray-700 backdrop-blur-sm">
            <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                <h2 class="text-xl font-bold text-gray-200">📂 나의 번호 리스트</h2>
                <span id="save-count" class="bg-gray-700 text-xs px-2 py-1 rounded-full text-gray-300">0개</span>
            </div>
            <ul id="my-numbers-list" class="space-y-3 max-h-60 overflow-y-auto pr-2 scrollbar-thin scrollbar-thumb-gray-600 scrollbar-track-transparent">
                <!-- Saved numbers will go here -->
                <li class="text-center text-gray-500 text-sm py-4">아직 저장된 번호가 없습니다.</li>
            </ul>
        </div>

    </main>

    <!-- Background Elements for Atmosphere -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-neon-purple/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-neon-blue/20 rounded-full blur-[120px]"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
